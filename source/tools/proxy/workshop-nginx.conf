# Reverse proxy in front of DSF's DuetWebServer (A-02). READY TO APPLY BY THE OWNER: nothing in this repo installs it.
# Steps and rollback: docs/HARDENING.md.
#
# Why: DuetWebServer (Kestrel) sends every asset uncompressed (no response compression, it does not serve the .gz files next to
# the plugin bundles) and adds no security headers. nginx takes port 80, DuetWebServer moves to 127.0.0.1:5000.
#   - gzip for text (app.js 3.8 MB, monaco 5.1 MB, babylon 2.4 MB, plugin bundles): about 4-5 times smaller on the wire
#   - headers: X-Content-Type-Options, X-Frame-Options (clickjacking), Referrer-Policy, Permissions-Policy, CSP (report-only first)
#   - WebSocket (/machine) and uploads (/machine/file) pass through unchanged
# TLS: not enabled here. A certificate for a LAN host is a self-signed one (browser warning) or a private CA; add it only when the
# network is not trusted. The commented server block at the end shows the lines; with TLS also send Strict-Transport-Security.
# Brotli needs the module libnginx-mod-http-brotli-filter (apt); the two brotli lines are commented out.
# The camera relay (:8090) and Vision (:8095) are separate ports opened by the pages directly: not proxied here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # uploads of G-code, zips and macros go through here: no size limit of nginx's own (DSF decides)
    client_max_body_size 0;
    proxy_request_buffering off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm font/ttf;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-only: the browser logs what it WOULD block, nothing breaks. After a week without violations in the console of every
    # page and the kiosk, rename the header to Content-Security-Policy. connect-src and img-src name the camera relay (8090) and
    # Vision (8095) on any host of the LAN origin; 'unsafe-eval' and 'unsafe-inline' are what Monaco and Vuetify need.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://*:8090 http://*:8095; media-src 'self' blob: http://*:8090; connect-src 'self' ws: wss: http://*:8090 http://*:8095; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# TLS variant (replace the listen lines above; certificate paths are examples):
#   listen 443 ssl;
#   ssl_certificate     /etc/ssl/workshop/workshop.crt;
#   ssl_certificate_key /etc/ssl/workshop/workshop.key;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   add_header Strict-Transport-Security "max-age=31536000" always;
# and a second server { listen 80; return 301 https://$host$request_uri; }
